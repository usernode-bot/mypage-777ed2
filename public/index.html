  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();

            seen.add(val);

          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);

    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),

      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };

  <script>
  // Appearance boot — blocking on purpose so dark users never see a white
  // flash. Duplicated verbatim in view.html; /js/theme.js is the source of
  // truth for the signal contract (html.dark + data-theme + data-theme-mode).
  (function () {
    var MODES = ['light', 'dark', 'system'];
    var mode = null;
    try {
      var q = new URLSearchParams(location.search).get('theme');
      // ?theme=… is a deep-link override for this load only — never persisted.
      if (MODES.indexOf(q) >= 0) { mode = q; window.__mpThemeOverride = q; }
    } catch (_) {}
    if (!mode) {
      try {
        var v = localStorage.getItem('mp_theme');
        if (MODES.indexOf(v) >= 0) mode = v;
      } catch (_) {}
    }
    if (!mode) mode = 'system';
    var dark = mode === 'dark' || (mode === 'system'
      && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var root = document.documentElement;
    if (dark) root.classList.add('dark');
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-theme-mode', mode);
  })();
  </script>

  <title>MyPage</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23EEF4FC'/><text x='50' y='68' font-size='52' text-anchor='middle'>✨</text></svg>">

  <script>tailwind.config = { darkMode: 'class', future: { hoverOnlyWhenSupported: true } }</script>

  <script src="https://social-vibecoding.usernodelabs.org/usernode-native/v1/native.js"></script>
  <link rel="stylesheet" href="/css/page.css">
  <style>
    /* Brand: baby-blue paper, white cards, deep navy ink, neon pops (pink /
       lime / yellow / lavender) reserved for the CTA, selected pills, active
       nav and small accents — never body text. The chrome stays clean and
       product-grade; the loudness lives inside the pages themselves.

       Every chrome colour routes through a token here so the html.dark block
       below can swap the whole shell without touching a single rule.
       --ink/--paper are SEMANTIC (foreground/background), so inverting their
       values is what makes .mp-btn / .mp-chip-on correct in dark for free.
       Page documents are NOT themed — see page.css. */
    :root {
      --paper: #EEF4FC; --paper-deep: #E2EBF8; --ink: #141F3C;
      --ink-soft: #55617F; --line: #D9E3F0;
      --accent: #D6479C; --accent-deep: #A93380; --accent-contrast: #ffffff;
      --neon-pink: #FF9DE2; --neon-lime: #C6F24E; --neon-yellow: #FFE93F; --lavender: #C9BBF5;
      /* CTA text is always dark navy on the gradient — never pale on light. */
      --cta-gradient: linear-gradient(90deg, #FF9DE2, #FFE93F);
      --surface: #ffffff; --surface-raised: #FFFFFF;
      --tint-accent: #FFF2FA; --tint-warm: #FFF8E4;
      --ok: #3E7A1E;
      --danger: #C0392B; --danger-line: #E5B4AE; --danger-solid: #C0392B;
      --warn-bg: #FDECEA; --warn-fg: #922B21; --warn-line: #F5B7B1;
      --info-fg: #7A5A1E; --info-line: #F0DFB8;
      --scrim: rgba(20,31,60,.45);
      --topbar-bg: rgba(238,244,252,.94);
      --hairline: rgba(20,31,60,.18);
      --shadow-card: rgba(20,31,60,.05);
      --shadow-modal: rgba(0,0,0,.25);
      /* Affordances that sit ON the page canvas. The canvas never darkens
         (it is a faithful preview of the published page), so these are
         deliberately NOT overridden in dark mode. */
      --canvas-accent: #D65A9E; --canvas-accent-deep: #B03A7C;
      --un-accent: #D6479C;
      color-scheme: light;
    }
    html.dark {
      --paper: #0E1630; --paper-deep: #16203E; --ink: #EAF0FB;
      --ink-soft: #9FACC8; --line: #26355C;
      --accent: #FF8FD8; --accent-deep: #FFB1E4; --accent-contrast: #2A0E1E;
      --neon-pink: #FF9DE2; --neon-lime: #C6F24E; --neon-yellow: #FFE93F; --lavender: #C9BBF5;
      --cta-gradient: linear-gradient(90deg, #FF9DE2, #FFE93F);
      --surface: #16203E; --surface-raised: #1C2848;
      --tint-accent: #2A1A2A; --tint-warm: #2A2418;
      --ok: #8FBF5A;
      --danger: #F08A7D; --danger-line: #6A3129; --danger-solid: #B8382B;
      --warn-bg: #3A1A18; --warn-fg: #F3B4AC; --warn-line: #5A2A26;
      --info-fg: #E3C88A; --info-line: #4A3D22;
      --scrim: rgba(3,6,16,.66);
      --topbar-bg: rgba(14,22,48,.92);
      --hairline: rgba(234,240,251,.16);
      --shadow-card: rgba(0,0,0,.22);
      --shadow-modal: rgba(0,0,0,.5);
      --un-accent: #FF8FD8; --un-accent-contrast: #2A0E1E;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }

    .mp-muted { color: var(--ink-soft); }
    .mp-kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-deep); font-weight: 700; }
    .mp-wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 24px; margin: 0; line-height: 1.05; }

    .mp-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--ink); color: var(--paper); font-weight: 700; font-size: 14px;
      border-radius: 12px; padding: 10px 16px; min-height: 40px;
    }
    /* The main CTA: pink→yellow gradient with dark navy text, per the brief.
       #141F3C is a literal (not var(--ink)) so dark mode keeps navy-on-neon. */
    .mp-btn-accent { background: var(--cta-gradient); color: #141F3C; }
    .mp-btn-quiet { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
    .mp-btn-danger { background: var(--danger-solid); color: #fff; }
    .mp-btn-sm { padding: 7px 13px; font-size: 13px; border-radius: 10px; min-height: 34px; }
    .mp-iconbtn { font-size: 20px; padding: 6px 10px; border-radius: 10px; color: var(--ink); }
    .mp-ico { width: 22px; height: 22px; display: block; }
    /* Selected filter pill: neon fill, navy text (never neon text). */
    .mp-pill-on { background: var(--neon-lime) !important; color: #141F3C !important; border-color: transparent !important; }

    /* ------------------------------------------------------ bottom nav */
    .mp-bottomnav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      display: flex; align-items: stretch; justify-content: space-around;
      background: var(--topbar-bg); backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .mp-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      flex: 1; padding: 6px 2px 4px; color: var(--ink-soft);
      font-size: 10.5px; font-weight: 700; border-radius: 12px;
    }
    .mp-nav-item svg { width: 23px; height: 23px; display: block; }
    .mp-nav-on { color: var(--ink); }
    .mp-nav-on .mp-nav-dot {
      display: block; width: 16px; height: 3px; border-radius: 99px; background: var(--neon-pink);
    }
    .mp-nav-dot { display: none; }
    .mp-nav-create {
      display: grid; place-items: center; align-self: center; flex: none;
      width: 50px; height: 50px; border-radius: 50%; margin: -10px 8px 0;
      background: var(--cta-gradient); color: #141F3C;
      box-shadow: 0 1px 4px rgba(20,31,60,.15);
    }
    .mp-nav-create svg { width: 26px; height: 26px; }
    /* Screens with the bottom nav need breathing room above it. */
    .mp-has-nav { padding-bottom: calc(96px + env(safe-area-inset-bottom)) !important; }

    /* ------------------------------------------------------------ hero */
    .mp-hero { padding: 10px 2px 4px; }
    .mp-hero-title {
      font-family: 'Fraunces', Georgia, serif; font-weight: 900;
      font-size: 34px; line-height: 1.06; margin: 0 0 6px; letter-spacing: -.01em;
    }
    .mp-hero-sub { color: var(--ink-soft); font-size: 15px; max-width: 430px; margin: 0 0 16px; }
    .mp-hero-acts { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
    /* Quiet secondary action — plain muted text, not a second big button. */
    .mp-link-quiet { color: var(--ink-soft); font-weight: 600; font-size: 14px; padding: 8px 2px; }
    /* Plain sans section heading (serif stays reserved for the wordmark
       and the hero headline). */
    .mp-h2 { font-size: 17px; font-weight: 700; margin: 22px 2px 10px; letter-spacing: -.01em; }

    /* --------------------------------------------- template previews */
    /* An accurate miniature: the template's real doc rendered at page width
       (720px) inside a clipped card, scaled down with transform. */
    .mp-tpl-thumb { position: relative; overflow: hidden; background: var(--paper-deep); pointer-events: none; }
    .mp-tpl-scaler { position: absolute; top: 0; left: 0; width: 720px; transform-origin: top left; }
    /* Home template carousel — content cards, Netflix/Pinterest style:
       one rounded image (~75–80% of the tile), concise text underneath,
       no card box around the whole thing. */
    .mp-carousel {
      display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none;
      padding: 2px 18px 8px; margin: 0 -18px;
      scroll-snap-type: x proximity;
    }
    .mp-carousel::-webkit-scrollbar { display: none; }
    .mp-tpl-tile { flex: none; width: 236px; scroll-snap-align: start; text-align: left; padding: 0; }
    .mp-tpl-tile-img {
      position: relative; height: 312px; border-radius: 16px; overflow: hidden;
      background: var(--paper-deep);
    }
    .mp-tpl-tile-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mp-tpl-tile-name { font-weight: 600; font-size: 14.5px; margin: 9px 2px 0; }
    .mp-tpl-tile-tag { font-size: 12.5px; color: var(--ink-soft); margin: 1px 2px 0; }
    .mp-tpl-card {
      display: block; width: 100%; text-align: left; margin-bottom: 14px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
      overflow: hidden; box-shadow: 0 1px 0 var(--shadow-card); padding: 0;
    }
    .mp-tpl-card .mp-tpl-thumb { height: 210px; pointer-events: auto; cursor: pointer; }
    .mp-tpl-body { padding: 12px 16px 14px; }
    .mp-tpl-name { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 18px; }
    .mp-tpl-desc { font-size: 13px; color: var(--ink-soft); margin: 2px 0 10px; }
    .mp-tpl-acts { display: flex; align-items: center; gap: 8px; }
    .mp-search {
      width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
      padding: 10px 12px; font: inherit; font-size: 14px; color: var(--ink); outline: none;
      margin-bottom: 10px;
    }
    .mp-search:focus { border-color: var(--accent); }
    .mp-fullpreview {
      position: fixed; inset: 0; z-index: 75; background: var(--paper);
      overflow-y: auto; overscroll-behavior: contain;
    }
    .mp-fullpreview-bar {
      position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      background: var(--topbar-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
    }
    .mp-fullpreview-title { flex: 1; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ------------------------------------------------------------- home */
    .mp-home-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: calc(16px + env(safe-area-inset-top)) 18px 8px;
      max-width: 720px; margin: 0 auto;
    }
    .mp-home-actions { display: flex; align-items: center; gap: 8px; flex: none; }
    /* Appearance control — same round chip on home, directory and /make. */
    .mp-themebtn {
      display: inline-grid; place-items: center; flex: none;
      width: 38px; height: 38px; border-radius: 50%; font-size: 17px; line-height: 1;
      background: var(--surface); border: 1.5px solid var(--line); color: var(--ink);
    }
    .mp-themebtn:active { border-color: var(--accent); }
    .mp-door-sub { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
    .mp-home { max-width: 720px; margin: 0 auto; padding: 14px 18px calc(40px + env(safe-area-inset-bottom)); }
    .mp-make { max-width: 480px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)); }
    .mp-make-top { display: flex; justify-content: flex-end; margin-bottom: 4px; }
    .mp-sect-label { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; margin: 12px 2px 8px; }
    .mp-card-list { display: flex; flex-direction: column; gap: 10px; }
    .mp-card {
      display: block; width: 100%; text-align: left;
      background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
      padding: 14px 16px; box-shadow: 0 1px 0 var(--shadow-card); margin-bottom: 10px;
    }
    .mp-card-gift { border: 1.5px dashed var(--accent); background: var(--tint-accent); }
    .mp-card-row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .mp-card-title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 17.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mp-card-row2 { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .mp-status-pub { color: var(--ok); font-weight: 600; }
    .mp-status-draft { color: var(--accent-deep); font-weight: 600; }
    .mp-badge { background: var(--accent); color: var(--accent-contrast); font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 9px; }
    .mp-badge-danger { background: var(--danger-solid); color: #fff; }
    .mp-chip {
      display: inline-flex; align-items: center; gap: 4px; flex: none;
      font-size: 12px; font-weight: 600; color: var(--ink-soft);
      background: var(--paper-deep); border-radius: 99px; padding: 4px 11px; white-space: nowrap;
    }
    .mp-empty { text-align: center; padding: 56px 20px; max-width: 380px; margin: 0 auto; }
    .mp-empty-art { font-size: 34px; margin-bottom: 12px; }
    .mp-draftbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      background: var(--tint-warm); border: 1.5px dashed var(--accent-deep); border-radius: 14px;
      padding: 12px 14px; margin: 12px 0; font-size: 13.5px;
    }

    /* -------------------------------------------------------- directory */
    .mp-dir-filters { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
    .mp-dir-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .mp-dir-card {
      display: block; text-decoration: none; color: inherit;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
      box-shadow: 0 1px 0 var(--shadow-card);
    }
    .mp-dir-preview {
      height: 110px; display: flex; align-items: center; padding: 10px 12px; overflow: hidden;
      position: relative;
    }
    .mp-dir-peek { font-size: 15px; font-weight: 700; line-height: 1.2; word-break: break-word; max-height: 90px; overflow: hidden; }
    .mp-dir-info { padding: 9px 12px 11px; }
    .mp-dir-title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-dir-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }

    /* ------------------------------------------------------------ modal */
    .mp-backdrop {
      position: fixed; inset: 0; background: var(--scrim); z-index: 70;
      display: grid; place-items: center; padding: 18px;
    }
    .mp-modal {
      position: relative;
      background: var(--surface-raised); border-radius: 18px; width: 100%; max-width: 440px;
      max-height: 84vh; overflow: auto; padding: 20px;
      box-shadow: 0 18px 50px var(--shadow-modal);
    }
    .mp-modal-title { font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: 20px; margin: 0 0 12px; padding-right: 30px; }
    /* Every dialog gets an explicit ✕ — pickers must never feel stuck. */
    .mp-modal-x {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      background: var(--paper-deep); color: var(--ink-soft); font-size: 14px; font-weight: 700;
    }
    .mp-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .mp-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; margin: 12px 0 6px; }
    .mp-input {
      width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
      padding: 10px 12px; font: inherit; color: var(--ink); outline: none;
    }
    .mp-input:focus { border-color: var(--accent); }
    .mp-input-bad { border-color: var(--danger); }
    .mp-textarea { min-height: 130px; resize: vertical; white-space: pre-wrap; }
    .mp-form-err { color: var(--danger); font-size: 12.5px; min-height: 16px; margin: 6px 0 0; }
    .mp-slug-row { display: flex; align-items: center; gap: 6px; }
    .mp-slug-prefix { font-family: monospace; color: var(--ink-soft); font-size: 15px; }
    .mp-linkbox {
      font-family: monospace; font-size: 13px; background: var(--paper-deep);
      border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px;
      word-break: break-all; margin-top: 10px;
    }
    .mp-doors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mp-door {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px;
      padding: 16px 8px; font-weight: 600; font-size: 13.5px;
    }
    .mp-door:active, .mp-door-on { border-color: var(--accent); }
    .mp-door-emoji { font-size: 26px; }
    .mp-doors .mp-door:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .mp-menurow {
      display: block; width: 100%; text-align: left; font-weight: 600; font-size: 14.5px;
      padding: 12px 4px; border-bottom: 1px solid var(--line);
    }
    .mp-mini-toast {
      position: fixed; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--ink); color: var(--paper); font-size: 13.5px; font-weight: 600;
      padding: 10px 18px; border-radius: 99px; z-index: 90; box-shadow: 0 6px 20px rgba(0,0,0,.3);
    }

    /* ----------------------------------------------------------- editor */
    .mp-topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 8px;
      padding: calc(10px + env(safe-area-inset-top)) 12px 8px;
      background: var(--topbar-bg); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .mp-topbar-title {
      flex: 1; min-width: 0; text-align: left;
      font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 17px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mp-savestate { font-size: 11.5px; color: var(--ink-soft); flex: none; min-width: 52px; text-align: right; }
    .mp-toolstrip {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      max-width: 720px; margin: 0 auto; padding: 8px 12px;
    }
    .mp-toolstrip::-webkit-scrollbar { display: none; }
    .mp-warnbar, .mp-infobar {
      max-width: 720px; margin: 0 auto; padding: 9px 16px; font-size: 12.5px;
      background: var(--warn-bg); color: var(--warn-fg); border-bottom: 1px solid var(--warn-line);
    }
    .mp-infobar { background: var(--tint-warm); color: var(--info-fg); border-color: var(--info-line); }
    /* Template guidance checklist — editor chrome only, never on the page. */
    .mp-checklist {
      max-width: 720px; margin: 0 auto; padding: 10px 16px 11px;
      background: var(--surface); border-bottom: 1px solid var(--line);
      display: flex; align-items: flex-start; gap: 10px;
    }
    .mp-checklist ol { margin: 0; padding: 0 0 0 18px; flex: 1; font-size: 12.5px; color: var(--ink-soft); list-style: decimal; }
    .mp-checklist li { padding: 1px 0; }
    .mp-checklist li::marker { font-weight: 800; color: var(--accent); }
    .mp-checklist-kicker { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
    .mp-checklist-x {
      flex: none; width: 26px; height: 26px; border-radius: 50%;
      display: grid; place-items: center; background: var(--paper-deep);
      color: var(--ink-soft); font-size: 12px; font-weight: 700;
    }
    /* Publish dialog: the three visibility choices. */
    .mp-vis-row {
      display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
      border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px;
      background: var(--surface);
    }
    .mp-vis-row.mp-vis-on { border-color: var(--accent); background: var(--tint-accent); }
    .mp-vis-emoji { font-size: 20px; flex: none; }
    .mp-vis-name { font-weight: 800; font-size: 14.5px; }
    .mp-vis-desc { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
    /* Full-bleed canvas: section backgrounds span the editor's whole
       width; blocks live in the renderer's centered content column. A
       light dashed edge marks the editing column while editing. */
    #mp-canvas-wrap { margin: 0 auto; }
    #mp-canvas { min-height: 200px; }
    /* Dark chrome / light canvas: a hairline ring makes the canvas read as
       "the page" rather than a broken panel. */
    html.dark #mp-canvas { box-shadow: 0 0 0 1px var(--line); }
    /* 👁️ preview mode — hide every editing affordance */
    body.mp-previewing #mp-toolstrip,
    body.mp-previewing #mp-panel,
    body.mp-previewing #mp-add-section { display: none; }
    .mp-add-section {
      display: block; width: calc(100% - 36px); margin: 14px auto 0;
      border: 1.5px dashed var(--line); border-radius: 14px; padding: 13px;
      color: var(--ink-soft); font-weight: 600; font-size: 14px; background: transparent;
    }
    .mp-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
      background: var(--surface-raised); border-top: 1px solid var(--line);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 8px;
      max-width: 720px; margin: 0 auto;
    }
    .mp-panel-row { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .mp-panel-row::-webkit-scrollbar { display: none; }
    .mp-panel-hint { justify-content: center; font-size: 12.5px; padding: 4px 0; }
    .mp-chip-btn { border: 1px solid var(--line); background: var(--surface); }
    .mp-chip-on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .mp-chip-strong { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
    .mp-chip-danger { color: var(--danger); border-color: var(--danger-line); }
    .mp-slider { flex: 1; min-width: 110px; accent-color: var(--accent); }
    .mp-swatch {
      width: 26px; height: 26px; border-radius: 50%; flex: none;
      border: 1.5px solid var(--hairline); padding: 0; cursor: pointer;
    }
    .mp-swatch-on { outline: 2px solid var(--accent); outline-offset: 2px; }
    .mp-swatch-custom { border-radius: 8px; width: 34px; }
    .mp-bg-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .mp-bg-cell { height: 40px; border-radius: 10px; border: 1.5px solid var(--line); }
    .mp-emoji-featured { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
    .mp-emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin-bottom: 6px; }
    .mp-emoji-cell { font-size: 23px; line-height: 1; padding: 6px 2px; border-radius: 8px; }
    .mp-emoji-cell:active { background: var(--paper-deep); }
    .mp-emoji-mount { max-height: 40vh; overflow-y: auto; }
    .mp-sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 6px; }
    .mp-sticker-cell { padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .mp-sticker-cell svg { width: 100%; height: auto; display: block; }
    .mp-vibe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mp-vibe-cell { text-align: left; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
    .mp-vibe-preview { height: 52px; }
    .mp-vibe-name { font-weight: 800; font-size: 13.5px; padding: 7px 10px 0; }
    .mp-vibe-desc { font-size: 11px; color: var(--ink-soft); padding: 0 10px 9px; }
    .mp-footer-swatch { border-radius: 10px; padding: 10px 12px; font-size: 12px; font-weight: 800; border: 1px solid var(--hairline); }
    .mp-src-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .mp-src-row { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 8px; }
    .mp-src-on { border-color: var(--accent); background: var(--tint-accent); }
    .mp-src-pick { flex: 1; text-align: left; font-size: 13.5px; font-weight: 600; padding: 6px 2px; }
    .mp-gbm-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .mp-gbm-pending { background: var(--tint-warm); margin: 0 -8px; padding: 10px 8px; border-radius: 10px; }
    .mp-gbm-acts { display: flex; gap: 6px; flex: none; }
    .mp-pixel-editor { display: flex; flex-direction: column; gap: 10px; }
    .mp-pixel-canvas {
      width: 100%; max-width: 288px; aspect-ratio: 1; margin: 0 auto;
      image-rendering: pixelated; touch-action: none; cursor: crosshair;
      /* Literal checkerboard: it depicts TRANSPARENCY in the drawing, not
         chrome — it must not follow the theme. */
      background:
        conic-gradient(#eee 25%, #fff 0 50%, #eee 0 75%, #fff 0) 0 0 / 18px 18px;
      border: 1.5px solid var(--line); border-radius: 8px;
    }
    .mp-pixel-palette { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

    /* --------------------------------------------- editing affordances */
    /* These float ON TOP of the page canvas, which never darkens (it is a
       faithful preview of the published page). They use the fixed
       --canvas-accent tokens on purpose — do NOT route them through
       --accent / --surface, or a dark handle lands on a light page. */
    .mp-editing .mp-block { touch-action: none; cursor: grab; }
    .mp-editing .mp-block:active { cursor: grabbing; }
    .mp-block.mp-selected { outline: 2px dashed var(--canvas-accent); outline-offset: 5px; border-radius: 4px; }
    #mp-canvas.mp-editing .mp-section-content {
      border-left: 1px dashed rgba(31,43,71,.18);
      border-right: 1px dashed rgba(31,43,71,.18);
    }
    .mp-handle {
      position: absolute; width: 28px; height: 28px; border-radius: 50%;
      background: #fff; border: 2px solid var(--canvas-accent); color: var(--canvas-accent-deep);
      display: grid; place-items: center; font-size: 14px; z-index: 300;
      box-shadow: 0 2px 6px rgba(0,0,0,.22); touch-action: none;
    }
    .mp-handle-rotate { top: -40px; left: 50%; margin-left: -14px; }
    .mp-handle-resize { right: -16px; bottom: -16px; cursor: nwse-resize; }
    .mp-section-bar {
      position: absolute; top: 8px; right: 8px; z-index: 250;
      display: flex; gap: 6px;
    }
    .mp-section-bar .mp-chip-btn {
      background: rgba(255,253,248,.92); color: #1F2B47; border-color: rgba(31,43,71,.18);
      box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }
  </style>
</head>

  <div id="app"></div>
  <script src="/js/theme.js"></script>
  <script src="/js/renderer.js"></script>
  <script src="/js/widgets.js"></script>
  <script src="/js/cursor.js"></script>
  <script src="/js/song.js"></script>
  <script src="/js/draft.js"></script>
  <script src="/js/emoji.js"></script>
  <script src="/js/editor.js"></script>
  <script src="/js/app.js"></script>
