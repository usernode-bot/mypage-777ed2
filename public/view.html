<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script>
  // Appearance boot — blocking on purpose so dark users never see a white
  // flash. Duplicated verbatim in index.html; /js/theme.js is the source of
  // truth for the signal contract (html.dark + data-theme + data-theme-mode).
  (function () {
    var MODES = ['light', 'dark', 'system'];
    var mode = null;
    try {
      var q = new URLSearchParams(location.search).get('theme');
      // ?theme=… is a deep-link override for this load only — never persisted.
      if (MODES.indexOf(q) >= 0) { mode = q; window.__mpThemeOverride = q; }
    } catch (_) {}
    if (!mode) {
      try {
        var v = localStorage.getItem('mp_theme');
        if (MODES.indexOf(v) >= 0) mode = v;
      } catch (_) {}
    }
    if (!mode) mode = 'system';
    var dark = mode === 'dark' || (mode === 'system'
      && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var root = document.documentElement;
    if (dark) root.classList.add('dark');
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-theme-mode', mode);
  })();
  </script>

  <title>MyPage</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FAF6EE'/><text x='50' y='68' font-size='52' text-anchor='middle'>✨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=Comic+Neue:wght@400;700&family=Caveat:wght@500;700&family=Special+Elite&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/page.css">
  <style>
    /* Quiet chrome — the page itself is the loud part. Only the CHROME here
       (byline strip, claim bar, report modal, loading/error states) follows
       the visitor's appearance preference; the rendered page document never
       does. There is no appearance control on a public page. */
    :root {
      --paper: #FAF6EE; --paper-deep: #F3EDDF; --ink: #1F2B47;
      --ink-soft: #5A6378; --line: #E7DFCC;
      --accent: #D65A9E; --accent-deep: #B03A7C;
      --surface-raised: #FFFDF8;
      --scrim: rgba(31,43,71,.5);
      color-scheme: light;
    }
    html.dark {
      --paper: #14192A; --paper-deep: #1D2438; --ink: #ECE6DA;
      --ink-soft: #A2A9BC; --line: #2E3752;
      --accent: #C94C90; --accent-deep: #F2A3CD;
      --surface-raised: #202840;
      --scrim: rgba(4,7,14,.66);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; }
    /* Full-bleed: section backgrounds span the whole window; blocks stay
       in the renderer's centered .mp-section-content column. */
    #page { min-height: 100vh; }
    .v-state { max-width: 420px; margin: 18vh auto 0; text-align: center; padding: 24px; color: var(--ink-soft); }
    .v-state h1 { font-family: 'Fraunces', Georgia, serif; color: var(--ink); font-size: 22px; }
    .v-state a { color: var(--accent-deep); font-weight: 700; }
    .v-byline {
      text-align: center; font-size: 12px; color: var(--ink-soft); padding: 8px 14px;
      background: var(--paper); border-bottom: 1px solid var(--line);
    }
    /* The claim bar is a call to action, not a surface — it stays rose in
       both themes (just a touch deeper in dark so white text still sings). */
    .v-claimbar {
      position: sticky; top: 0; z-index: 60; text-align: center;
      background: var(--accent); color: #fff; padding: 12px 16px; font-size: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
    .v-claimbar b { display: block; font-size: 15px; }
    .v-claim-actions { display: flex; gap: 8px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
    .v-claim-actions button, .v-claim-actions a {
      background: #fff; color: #B03A7C; border: none; cursor: pointer; text-decoration: none;
      font-weight: 800; font-size: 13px; border-radius: 99px; padding: 8px 16px; font-family: inherit;
    }
    .v-modal-back { position: fixed; inset: 0; background: var(--scrim); z-index: 80; display: grid; place-items: center; padding: 18px; }
    .v-modal { background: var(--surface-raised); color: var(--ink); border-radius: 16px; padding: 20px; width: 100%; max-width: 380px; }
    .v-modal h2 { font-family: 'Fraunces', Georgia, serif; font-size: 18px; margin: 0 0 10px; }
    .v-modal label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 7px 0; cursor: pointer; }
    .v-modal textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; min-height: 60px; margin-top: 8px; background: var(--paper); color: var(--ink); }
    .v-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .v-modal-actions button { border: none; cursor: pointer; font-weight: 700; font-size: 13.5px; border-radius: 10px; padding: 9px 15px; font-family: inherit; background: var(--paper-deep); color: var(--ink); }
    .v-modal-actions button.accent { background: var(--accent); color: #fff; }
    .v-note { font-size: 12.5px; color: var(--ink-soft); }
  </style>
</head>
<body>
  <div id="page"><div class="v-state"><h1>✨</h1><p>opening the page…</p></div></div>
  <script src="/js/theme.js"></script>
  <script src="/js/renderer.js"></script>
  <script src="/js/widgets.js"></script>
  <script src="/js/cursor.js"></script>
  <script src="/js/song.js"></script>
  <script src="/js/view.js"></script>
</body>
</html>
